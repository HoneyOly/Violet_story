<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Книги Древних</title>
<!-- Шрифты с кириллицей. Для работы офлайн положите .woff2 в assets/fonts/ и подключите через @font-face в css/style.css -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Cormorant+SC:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

<!-- ФОНОВЫЙ ЗАДНИК: бесшовно зацикленное видео (loop). Чтобы заменить — подставьте свой файл под именем
     assets/images/bg.mp4 (или поменяйте src). Видео без звука (muted), иначе браузер не даст ему автозапуск.
     Если файл не найден, слой скрывается автоматически (см. main.js). ?v=2 — сброс кэша при замене файла. -->
<div id="bg" aria-hidden="true">
  <video autoplay muted loop playsinline preload="auto">
    <source src="assets/images/bg.mp4?v=2" type="video/mp4">
  </video>
</div>

<canvas id="gl"></canvas>

<!-- Правая полка: 7 рамок-слотов создаются в main.js. 3D-книги ставятся по центру каждой рамки -->
<div id="shelf"></div>

<div id="hint"></div>
<button id="sound" type="button" aria-pressed="true">🔊 Звук: ВКЛ</button>

<div id="bar">
  <div class="grp" id="gCenter">
    <button id="bOpen">Открыть книгу</button>
    <button id="bBack1">Вернуть на полку</button>
  </div>
  <div class="grp" id="gRead">
    <button id="bPrev">◀ Предыдущая страница</button>
    <span id="pg"></span>
    <button id="bNext">Следующая страница ▶</button>
    <button id="bClose">Закрыть книгу</button>
    <button id="bBack2">Вернуть на полку</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<!-- Порядок важен: сначала данные (BOOKS), затем логика -->
<script src="js/books-data.js?v=5"></script>
<script src="js/main.js?v=5"></script>
</body>
</html>
